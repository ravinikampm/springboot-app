apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-springboot-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: springboot-app
  template:
    metadata:
      labels:
        app: springboot-app
    spec:
      containers:
      - name: my-springboot-app
        # ✅ Updated ACR registry name
        image: rgacr2802.azurecr.io/springboot-app:latest
        imagePullPolicy: Always
        ports:
        # ✅ Updated to match your application's port
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: springboot-app
    k8s-app: springboot-app
  name: springboot-app
spec:
  ports:
  - name: http
    port: 80
    protocol: TCP
    # ✅ Updated to match the deployment's containerPort
    targetPort: 8080
  type: LoadBalancer
  selector:
    app: springboot-app
